<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>在Servlet中使用Thymeleaf</title>
    <script>
        function del(deptNO){
            if(window.confirm("你确定要删除数据吗?")){
                window.location.href="/dept/delete?deptNo="+deptNO
            }
        }
    </script>
</head>
<body>
   <p th:text="|Welcome Home,${username}|">Welcome Home,Girl</p>
   <hr>
   <button onclick="del(10)">删除部门</button>
   <hr>
   <p>th:text的效果</p>
  <!--th:text不会解析html标签，是安全的-->
   <p th:text="${msg}">Welcome Home,Girl</p>
   <p>th:utext的效果</p>
   <!--th:utext会解析执行HTML标签，所以是危险的 -->
   <p th:utext="${msg}">Welcome Home,Girl</p>
   <hr>
   <div th:text="${user}">用户信息</div>
   <div th:text="${user.username}">姓名</div>
   <div th:text="${user.age}">年龄</div>
   <hr>
   <p>th:if的效果</p>
   <p th:if="${user2.isAdmin}" th:text="${user2.username}">管理员姓名</p>
   <p>th:unless的效果</p>
   <p th:unless="${user2.isAdmin}" th:text="${user2.username}">管理员姓名</p>
   <hr>
    <h3>用户集合</h3>
   <ul>
<!--      <li th:each="user : ${users}" th:text="|${user.username} == ${user.age} == ${user.isAdmin}|"></li>-->
      <li th:each="user,status : ${users}" >
         <p>
             索引值:  <span th:text="${status.index}"></span>
             用户姓名: <span th:text="${user.username}"></span>
             用户年龄: <span th:text="${user.age}"></span>
             是否管理员:<span th:text="${user.isAdmin}"></span>
         </p>

      </li>
   </ul>
   <hr>
<h4>Thymeleaf动态链接</h4>
<!--   <a th:href="@{/detail?id=5}">部门详情</a>-->
<!--   <a th:href="@{/detail(id=5)}">部门详情</a>-->
<!--   <a th:href="@{/detail(id=5)}">部门详情</a>-->
   <!--拼接路径：http://localhost:8080/web14/detail?id=5&admin=jack   -->
   <a th:href="@{/detail(id=5,admin='jack')}">部门详情</a>
   <hr>
<h3>Thymeleaf绑定表单</h3>
<!--   <form th:action="@{/save}" method="post">-->
<!--       用户名：<input type="text" name="username" id="username" th:value="${user.username}"> <br>-->
<!--       年 龄：<input type="text" name="age" id="age" th:value="${user.age}"> <br>-->
<!--       <button>提交</button>-->
<!--   </form>-->
   <form th:action="@{/save}" method="post" th:object="${user}">
       用户名：<input type="text" name="username" id="username" th:value="*{username}"> <br>
       年 龄：<input type="text" name="age" id="age" th:value="*{age}"> <br>
       <button>提交</button>
   </form>
   <hr>
   <!--定义公共头部-->
   <div th:fragment="header1">
       <h1>本模块里面的公共头部</h1>
   </div>
  <!-- 使用本模板文件的公共头部  -->
   <div th:replace="~{::header1}"></div>
  <!-- 使用common.html模板文件的公共头部  -->
  <div th:replace="~{common::header2}"></div>
<!--  #string2,#numbers,#dates,#lists-->
   <p th:text="${#strings.toUpperCase(user.username)}"></p>

   <div th:each="i : ${#numbers.sequence(1, 5)}">
       <span th:text="'第 ' + ${i} + ' 行'"></span>
   </div>
<!--   <p th:text="${#dates.createNow().toLocaleString()}"></p>-->
   <p th:text="|当前日期: ${#dates.format(#dates.createNow(),'yyyy-MM-dd HH:mm:ss')}|"></p>
  <p th:text="${#lists.size(users)}"></p>
</body>
</html>
