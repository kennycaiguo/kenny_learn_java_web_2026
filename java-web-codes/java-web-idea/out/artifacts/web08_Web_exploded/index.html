<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>Dept Admin - 登录</title>
    <link rel="stylesheet" href="css/style.css">

<body class="login-page">

        <form id="loginForm" class="login-form" action="/web08/list.html">

            <label>密码<input
                id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>

<!--            <div id="loginError" class="login-error"></div>-->
            <button class="btn btn-primary login-btn" type="submit">登 录</button>
        </form>
    </div>
</div>

</body>
</html>
