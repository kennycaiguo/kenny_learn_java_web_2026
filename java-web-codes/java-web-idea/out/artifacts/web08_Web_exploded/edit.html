<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">Dept<span>Admin</span></div>
        <nav><a class="active" href="list.html">部门管理</a></nav>

    <main class="main">
        <header class="topbar"><h1>编辑部门</h1>
            <div class="user">管理员
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </header>
        <section class="page">
            <div class="page-header">
                <div><h2>编辑部门</h2>
                    <p>修改部门基础信息</p></div>
                <a class="btn btn-light" href="list.html">返回列表</a></div>
            <div class="card form-card">
                <form id="deptForm">
                    <div class="form-grid">
                        <label>部门名称<span>*</span><input name="name"
                                                            required></label><label>负责人<span>*</span><input
                            name="leader" required></label>
                        <label>上级部门<select name="parent">
                            <option value="">无（顶级部门）</option>
                            <option>技术部</option>
                            <option>市场部</option>
                            <option>人事部</option>
                            <option>财务部</option>
                        </select></label>
                        <label>联系电话<input name="phone"></label><label>状态<select name="status">
                        <option>启用</option>
                        <option>停用</option>
                    </select></label>
                        <label class="full">部门描述<textarea name="description" rows="5"></textarea></label></div>
                    <div class="form-actions">
                        <a class="btn btn-light" href="list.html">取消</a>
                        <button class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
