<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理系统 - 部门列表</title>
    <!--/dept/css/list.css的动态写法-->
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>部门列表</h1>
            <a th:href="@{/add}" class="add-btn">添加部门</a>
        </div>
        
        <table class="department-table">
            <thead>
                <tr>
                    <th>部门编号</th>
                    <th>部门名称</th>
                    <th>部门地理位置</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept:${depts}">
                    <td th:text="${dept.deptNo}">D001</td>
                    <td th:text="${dept.dName}">技术部</td>
                    <td th:text="${dept.loc}">北京总部A座3层</td>
                    <td>
                        <a th:href="@{/detail(id=${dept.deptNo})}" class="action-btn view-btn">查看</a>
                        <a th:href="@{/edit(id=${dept.deptNo})}" class="action-btn edit-btn">修改</a>
                        <a href="javascript:void(0)" class="action-btn delete-btn" onclick="">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="logout">
            <a href="@{/logout}">退出登录</a>
        </div>
    </div>
</body>
</html>
