<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理系统 - 部门列表</title>
    <!--/dept/css/list.css的动态写法-->
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <script th:inline="javascript">
          function deleteById(elem) {
             //获取项目根路径，js里面有点怪
             let cntPath = /*[[@{/}]]*/;
             let id = elem.getAttribute("data-id")
             if(window.confirm("你确定要删除数据吗，不可恢复哦")){
                document.location.href=cntPath+"delete?id="+id
             }
          }
    </script>
</head>
<body>
    <div class="container">
        <!-- 新增的用户信息栏 -->
        <div class="user-info">
            <span class="user-name" th:text="|当前用户:${session.username}|">当前用户：管理员</span>
            <div class="user-actions">
                <a th:href="@{/logout}">退出登录</a>
            </div>
        </div>

        <div class="header">
            <h1>部门列表</h1>
            <a th:href="@{/add}" class="add-btn">添加部门</a>
        </div>
        
        <table class="department-table">
            <thead>
                <tr>
                    <th>部门编号</th>
                    <th>部门名称</th>
                    <th>部门地理位置</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept:${depts}">
                    <td th:text="${dept.deptNo}">D001</td>
                    <td th:text="${dept.dName}">技术部</td>
                    <td th:text="${dept.loc}">北京总部A座3层</td>
                    <td>
                        <a th:href="@{/detail(id=${dept.deptNo})}" class="action-btn view-btn">查看</a>
                        <a th:href="@{/edit(id=${dept.deptNo})}" class="action-btn edit-btn">修改</a>
                        <!--这个this是前端的this，代表当前节点，和thymeleaf没有关系-->
                        <a href="javascript:void(0)" th:data-id="${dept.deptNo}" class="action-btn delete-btn"
                                                                                   onclick="deleteById(this)">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
<!--        <div class="logout">-->
<!--            <a href="@{/logout}">退出登录</a>-->
<!--        </div>-->
    </div>

</body>
</html>
