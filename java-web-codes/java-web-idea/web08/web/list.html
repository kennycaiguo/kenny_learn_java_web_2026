<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>部门列表</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">Dept<span>Admin</span></div>
        <nav><a class="active" href="list.html">部门管理</a></nav>
    </aside>
    <main class="main">
        <header class="topbar"><h1>部门管理</h1>
            <div class="user">管理员
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </header>
        <section class="page">
            <div class="page-header">
                <div><h2>部门列表</h2>
                    <p>查看、编辑和维护部门数据</p></div>
                <a class="btn btn-primary" href="add.html">＋ 新增部门</a></div>
            <div class="card">
                <div class="toolbar"><input id="keyword" class="input" placeholder="搜索部门名称 / 负责人"><select id="status"
                                                                                                          class="input select">
                    <option value="">全部状态</option>
                    <option>启用</option>
                    <option>停用</option>
                </select>
                    <button class="btn btn-light" onclick="render()">查询</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>部门名称</th>
                            <th>负责人</th>
                            <th>上级部门</th>
                            <th>联系电话</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="deptBody"></tbody>
                    </table>
                </div>
                <div class="empty" id="empty">暂无数据</div>
            </div>
        </section>
    </main>
</div>
<script src="js/data.js"></script>
<script src="js/list.js"></script>
<script>function logout() {
    localStorage.removeItem('dept_admin_auth');
    sessionStorage.removeItem('dept_admin_auth');
    location.href = 'index.html';
}</script>
</body>
</html>
